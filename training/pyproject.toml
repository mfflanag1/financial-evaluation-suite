[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "financial-portfolio-training"
version = "0.1.0"
description = "Separate native financial portfolio training contract and admission gates"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "financial-research==0.2.0",
    "financial-portfolio==0.3.0",
    "prime-rl==0.10.0",
    "prime-rl-configs==0.4.0",
    "verifiers==0.4.2.dev47",
    "renderers==0.2.1.dev9",
    "prime-pydantic-config==0.4.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/financial_portfolio_training"]
