[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "financial-selection-supervised"
version = "0.1.0"
description = "Bounded local launcher for the separate selection training contract"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = ["financial-selection-training==0.1.0"]

[project.scripts]
selection-supervise = "financial_selection_supervised.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_selection_supervised"]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/OPTIMIZER_VALIDATION.md", "/pyproject.toml", "/.gitignore", "/src", "/tests"]
