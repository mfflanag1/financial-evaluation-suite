[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "financial-research"
version = "0.2.0"
description = "Point-in-time financial research and portfolio evaluation pilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
prime = ["verifiers==0.4.1"]

[project.scripts]
financial-research = "financial_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_research"]
