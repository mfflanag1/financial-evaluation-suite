model = "INSTRUCT_MODEL_ID"
num_rollouts = 1
max_concurrent = 1
output_dir = "/tmp/portfolio-runtime-output"
dry_run = true

[run]
name = "runtime-smoke"
dir = "runtime-smoke"

[client]
type = "eval"
base_url = "https://endpoint.invalid/v1"
api_key_var = "PORTFOLIO_MODEL_API_KEY"

[sampling]
temperature = 0.2
max_tokens = 8192

[select]
shuffle = false
limit = 4

[env.retries]
max_retries = 0

[env.taskset]
id = "financial-portfolio-runtime"
split = "train"
seed_start = 4
num_tasks = 4

[env.taskset.task]
image = "python:3.12-slim"

[env.agent]
max_turns = 32
max_output_tokens = 65536
max_total_tokens = 262144
network_notice = true

[env.agent.retries]
max_retries = 0

[env.agent.harness]
id = "financial-portfolio-runtime"
dialect = "chat_completions"
edit = true
search = false
sdk_max_retries = 0
forward_env = []
guidance = ""

[env.agent.runtime]
type = "docker"
image = "python:3.12-slim"
allow = []

[env.agent.scoring]
mode = "isolated"

[env.agent.scoring.retries]
max_retries = 0
